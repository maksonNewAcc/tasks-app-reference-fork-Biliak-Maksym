version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-request-limit: 3
    groups:
      actions:
        patterns: ["*"]  
  - package-ecosystem: "pip"
    directory: "/services/tasks-api"
    schedule:
      interval: "weekly"
    open-pull-request-limit: 3